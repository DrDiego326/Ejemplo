<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCENSA - Producción</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
        }
        .header h1 {
            margin: 0;
       
        }
        .services {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
        .service-box {
            border: 1px solid lightgray;
            border-radius: 5px;
            padding: 10px;
            margin-right: 10px;
            text-align: center;
        }
        .service-box:last-child {
            margin-right: 0;
        }
        .service-box h3 {
            margin-top: 0;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            display: block;
            margin-top: 10px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .report-button {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: #f44336;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .report-button:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Producción</h1>
    </div>

    </div>
    <div class="services">
        <div class="service-box">
            <h3>Consulta por cédula</h3>
            <p>Consulte las calificaciones y/o descargue el carnet de una persona.</p>
            <button class="button">CONSULTAR POR CÉDULA</button>
        </div>
        <div class="service-box">
            <h3>Consulta por contrato</h3>
            <p>Consulte las calificaciones y/o descargue el carnet de un grupo de personas.</p>
            <button class="button">CONSULTAR POR CONTRATO</button>
        </div>
    </div>
    <button class="report-button">REPORTAR NOVEDAD</button>
</body>
</html>
